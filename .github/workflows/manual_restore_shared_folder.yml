name: Manual Restore - Shared Folder with Subfolders

on:
  workflow_dispatch:

jobs:
  restore_content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Gazer
        run: gem install gazer

      - name: Restore Structure and Content
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.INSTANCE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
          ROOT_SPACE_ID: "182" # Carpeta Shared principal
        run: |
          # 1. ENTRAR EN LA CARPETA DE BACKUP
          # Asumimos que el backup se guardó en content/dashboards/
          cd content
          
          echo "Iniciando importación recursiva en la carpeta $ROOT_SPACE_ID..."
          
          # 2. IMPORTACIÓN RECURSIVA
          # Usamos 'space import' (o 'folder import' si falla) 
          # El punto '.' indica que importe todo lo que hay en la carpeta actual
          # --force sobrescribe dashboards/looks si ya existen con el mismo nombre
          gzr space import . $ROOT_SPACE_ID --force --port 443

