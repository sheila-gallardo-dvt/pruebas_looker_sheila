name: Manual Restore - Shared Folder with Subfolders

on:
  workflow_dispatch:

jobs:
  restore_content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Gazer
        run: gem install gazer

      - name: Restore Structure and Content
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
          ROOT_SPACE_ID: "1" # Carpeta Shared principal
        run: |
          # 1. ENTRAR EN LA CARPETA DE BACKUP
          # Asumimos que el backup se guardó en content/dashboards/
          cd content/dashboards
          
          # 2. BORRAR TODO EL CONTENIDO ACTUAL DE SHARED (Recursivo)
          # Precaución: Esto limpia la carpeta 1 por completo antes de restaurar
          echo "Purgando carpeta Shared para restauración limpia..."
          gzr space purge $ROOT_SPACE_ID --force

          # 3. RESTAURAR CARPETAS Y ARCHIVOS
          # Usamos un comando especial de Gazer que intenta importar un árbol completo
          # Si el export se hizo con 'gzr space export', 'gzr space import' es el mejor aliado
          
          echo "Iniciando importación recursiva..."
          
          # Importamos el directorio actual (.) dentro del espacio raíz (1)
          # Gazer se encarga de crear las subcarpetas necesarias
          gzr space import . $ROOT_SPACE_ID --force
