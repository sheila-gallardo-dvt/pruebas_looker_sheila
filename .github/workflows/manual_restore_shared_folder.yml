name: Manual Restore - Shared Folder with Subfolders

on:
  workflow_dispatch:

jobs:
  restore_content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Gazer
        run: gem install gazer

      - name: Restore Structure and Content
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.INSTANCE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
          ROOT_SPACE_ID: "182" # Carpeta Shared principal
        run: |
          cd content
          
          # Buscamos todos los JSON ordenados para procesar carpetas antes que su contenido
          find . -name "*.json" -type f | sort | while read -r file; do
            
            filename=$(basename "$file")
            relative_dir=$(dirname "$file" | sed 's|^\./||')
            
            # 1. CASO: ARCHIVO DE CONFIGURACIÓN DE CARPETA
            if [[ "$filename" == Folder_* ]]; then
                echo "Configurando metadatos de carpeta: $filename"
                # Extraemos el nombre real del JSON de la carpeta
                folder_name=$(jq -r '.name' "$file")
                
                # Si estamos en la raíz, no creamos nada, solo actualizamos si fuera necesario
                if [ "$relative_dir" == "." ]; then
                    continue 
                fi
                
                # Creamos/Obtenemos el ID de la carpeta usando el nombre del JSON
                # Nota: 'gzr folder create' solo acepta NAME y PARENT_ID
                parent_id=$ROOT_SPACE_ID # Simplificado para un nivel, se puede iterar para más
                gzr folder create "$folder_name" "$parent_id" --port 443 2>/dev/null || echo "Carpeta ya existe."
                continue
            fi

            # 2. CASO: DASHBOARDS Y LOOKS
            # Determinamos la carpeta destino (si hay subcarpetas)
            dest_folder=$ROOT_SPACE_ID
            if [ "$relative_dir" != "." ]; then
                # Buscamos el ID de la carpeta destino por nombre
                dest_folder=$(gzr folder ls $ROOT_SPACE_ID --fields id,name --port 443 | jq -r ".[] | select(.name==\"$relative_dir\") | .id")
            fi

            echo "Restaurando contenido: $filename en carpeta ID $dest_folder"
            
            if [[ "$filename" == Look_* ]]; then
              gzr look import "$file" "$dest_folder" --force --port 443
            else
              gzr dashboard import "$file" "$dest_folder" --force --port 443
            fi
          done
