name: Manual Restore - Shared Folder with Subfolders

on:
  workflow_dispatch:

jobs:
  restore_content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install Gazer
        run: gem install gazer

      - name: Restore Structure and Content
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.INSTANCE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
          ROOT_SPACE_ID: "182" # Carpeta Shared principal
        run: |
          # 1. Entramos en la carpeta donde está el backup
          cd content

          # 2. Buscamos todos los JSON y los procesamos
          # Usamos -print0 y read -d para que los nombres con espacios no den error
          find . -name "*.json" -type f -print0 | while IFS= read -r -d '' file; do
            
            # Obtener el nombre de la carpeta donde está el archivo
            folder_path=$(dirname "$file" | sed 's|^\./||')
            
            # Si el archivo está en una subcarpeta, la creamos/buscamos
            dest_folder=$ROOT_SPACE_ID
            if [ "$folder_path" != "." ]; then
                # Creamos la subcarpeta y obtenemos su ID (Gazer suele devolver el ID si ya existe o la crea)
                # Nota: gzr folder create es más estable que space create
                dest_folder=$(gzr folder create "$folder_path" $ROOT_SPACE_ID --fields id | jq -r '.id' 2>/dev/null || gzr folder ls $ROOT_SPACE_ID --fields id,name | jq -r ".[] | select(.name==\"$folder_path\") | .id")
            fi

            echo "Restaurando $file en carpeta $dest_folder..."
            
            # Importación directa según el tipo
            if [[ "$file" == *"Look_"* ]]; then
              gzr look import "$file" "$dest_folder" --force --port 443
            else
              gzr dashboard import "$file" "$dest_folder" --force --port 443
            fi
          done
